<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Naufy Portfolio</title>
  <link rel="icon" type="image/png" href="Assets/fishsticker.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Margarine&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/lilex">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/projects.css">
</head>
<body class="project-page">
  <div class="site-loader site-loader--folder" data-loader-stickers="Assets/aboutme/cloversticker.webp,Assets/aboutme/fishsticker.webp,Assets/aboutme/catsticker.webp" aria-live="polite">
    <section class="site-loader__status" aria-label="Loading projects page">
      <h1 class="site-loader__title">
        Preparing Files<span class="site-loader__dots" aria-hidden="true"></span>
      </h1>
      <img class="site-loader__sticker" src="Assets/aboutme/cloversticker.webp" alt="" draggable="false">
      <p class="site-loader__wait">
        <span class="site-loader__wait-text">please wait</span>
        <span class="site-loader__face" aria-hidden="true">( &#8807;&#8704;&#8806;)&#12494;</span>
      </p>
    </section>
  </div>
  <main class="viewport project-page__viewport" aria-label="Projects canvas">
    <div class="canvas-world project-page__world">
      <section class="project-folders" aria-label="Project folders">
        <img class="project-paper project-paper--cc" src="Assets/Folder/CC-Paper.webp" alt="" draggable="false">
        <img class="project-paper project-paper--design" src="Assets/Folder/DESIGN-Paper.webp" alt="" draggable="false">
        <img class="project-paper project-paper--web" src="Assets/Folder/WEB-Paper.webp" alt="" draggable="false">
        <a class="project-folder-card project-folder-card--cc" href="cc.html" aria-label="Open content creation file">
          <img class="project-folder" src="Assets/Folder/CC-Folder.webp" alt="Content Creation folder" draggable="false">
          <span class="project-folder-open project-folder-open--cc">OPEN FILE &#8594;</span>
        </a>
        <a class="project-folder-card project-folder-card--design" href="design.html" aria-label="Open graphic design file">
          <img class="project-folder" src="Assets/Folder/DESIGN-Folder.webp" alt="Graphic Design folder" draggable="false">
          <span class="project-folder-open project-folder-open--design">OPEN FILE &#8594;</span>
        </a>
        <a class="project-folder-card project-folder-card--web" href="web.html" aria-label="Open website design file">
          <img class="project-folder" src="Assets/Folder/WEB-Folder.webp" alt="Website Design folder" draggable="false">
          <span class="project-folder-open project-folder-open--web">OPEN FILE &#8594;</span>
        </a>
      </section>
      <img class="project-info-card project-info-card--notes" src="Assets/Folder/Case-Notes.webp" alt="Case notes" draggable="false">
      <img class="project-info-card project-info-card--information" src="Assets/Folder/Information.webp" alt="Project information" draggable="false">
      <img class="project-desk-object project-desk-object--camera" src="Assets/Folder/camera.webp" alt="Camera" draggable="false">
      <img class="project-desk-object project-desk-object--film" src="Assets/Folder/film.webp" alt="Film strip" draggable="false">
      <img class="project-desk-object project-desk-object--magnifying" src="Assets/Folder/magnifying.webp" alt="Magnifying glass" draggable="false">
      <img class="project-desk-object project-desk-object--knife" src="Assets/Folder/knife.webp" alt="Craft knife" draggable="false">
      <a class="project-back-button" href="index.html" aria-label="Back to portfolio table">
        <img src="Assets/Folder/backbutton.webp" alt="" draggable="false">
      </a>
      <img class="project-desk-object project-desk-object--paperclip" src="Assets/Folder/paperclip.webp" alt="Paper clip" draggable="false">
      <img class="project-desk-object project-desk-object--clip" src="Assets/Folder/clip.webp" alt="Binder clip" draggable="false">
      <img class="project-desk-object project-desk-object--catpict" src="Assets/Folder/catpict.webp" alt="Cat picture" draggable="false">
      <img class="project-desk-object project-desk-object--cat-film" src="Assets/Folder/film.webp" alt="Film strip" draggable="false">
      <img class="project-desk-object project-desk-object--cat-clip" src="Assets/Folder/clip.webp" alt="Binder clip" draggable="false">
      <nav class="project-bookmarks" aria-label="Project section bookmarks">
        <a class="project-bookmark project-bookmark--case" href="projects.html">CASE FILES</a>
        <a class="project-bookmark project-bookmark--content" href="cc.html">CONTENT</a>
        <a class="project-bookmark project-bookmark--design" href="design.html">DESIGN</a>
        <a class="project-bookmark project-bookmark--website" href="web.html">WEBSITE</a>
      </nav>
    </div>
  </main>
  <script src="js/index-loader.js"></script>
  <script src="js/canvas.js"></script>
</body>
</html>
