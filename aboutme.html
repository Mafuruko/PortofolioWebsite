<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me | Naufy Portfolio</title>
  <link rel="icon" type="image/png" href="Assets/fishsticker.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Margarine&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/about.css">
</head>
<body class="about-page">
  <div class="site-loader site-loader--about" data-loader-stickers="Assets/aboutme/catsticker.webp,Assets/aboutme/fishsticker.webp,Assets/aboutme/cloversticker.webp" aria-live="polite">
    <section class="site-loader__status" aria-label="Loading about page">
      <h1 class="site-loader__title">
        Preparing Profile<span class="site-loader__dots" aria-hidden="true"></span>
      </h1>
      <img class="site-loader__sticker" src="Assets/aboutme/catsticker.webp" alt="" draggable="false">
      <p class="site-loader__wait">
        <span class="site-loader__wait-text">please wait</span>
        <span class="site-loader__face" aria-hidden="true">( &#8807;&#8704;&#8806;)&#12494;</span>
      </p>
    </section>
  </div>
  <main class="viewport about-page__viewport" aria-label="About me canvas">
    <div class="canvas-world about-page__world">
      <img class="about-page__naufy-pict" src="Assets/aboutme/naufypict.webp" alt="Naufal Dzakwan" draggable="false">
      <img class="about-page__psm-logo" src="Assets/aboutme/psmitslogo.webp" alt="PSM ITS logo" draggable="false">
      <img class="about-page__its-logo" src="Assets/aboutme/itslogo.webp" alt="ITS logo" draggable="false">
      <img class="about-page__infor-logo" src="Assets/aboutme/inforlogo.webp" alt="Informatics logo" draggable="false">
      <img class="about-page__naufy-polaroid" src="Assets/aboutme/naufypolaroid.webp" alt="Naufy polaroid" draggable="false">
      <img class="about-page__paperclip" src="Assets/aboutme/paperclip.webp" alt="" draggable="false">
      <img class="about-page__focus-area" src="Assets/aboutme/focusarea.webp" alt="Focus area" draggable="false">
      <img class="about-page__what-good" src="Assets/aboutme/whatimgoodat.webp" alt="What I'm good at" draggable="false">
      <img class="about-page__smk-logo" src="Assets/aboutme/smklogo.webp" alt="SMK logo" draggable="false">
      <img class="about-page__fk-logo" src="Assets/aboutme/fklogo.webp" alt="FK logo" draggable="false">
      <img class="about-page__quote" src="Assets/aboutme/quote.webp" alt="Creating, learning, and enjoying every little moment along the way." draggable="false">
      <a class="about-page__back-button" href="index.html" aria-label="Back to table">
        <img src="Assets/aboutme/backbutton.webp" alt="Back to table" draggable="false">
      </a>
      <img class="sticker about-page__sticker about-page__sticker--fish" src="Assets/aboutme/fishsticker.webp" alt="" draggable="false">
      <img class="sticker about-page__sticker about-page__sticker--clover" src="Assets/aboutme/cloversticker.webp" alt="" draggable="false">
      <img class="sticker about-page__sticker about-page__sticker--cat" src="Assets/aboutme/catsticker.webp" alt="" draggable="false">
      <img class="about-page__desk-object about-page__eraser" src="Assets/eraser.webp" alt="Pink eraser" draggable="false">
      <img class="about-page__desk-object about-page__pencil" src="Assets/aboutme/pencilabout.webp" alt="Yellow pencil" draggable="false">
      <a class="about-page__newspaper" href="projects.html" aria-label="Open projects archive">
        <img src="Assets/aboutme/newspaper.webp" alt="Newspaper projects archive" draggable="false">
      </a>
    </div>
  </main>
  <script src="js/index-loader.js"></script>
  <script src="js/canvas.js"></script>
</body>
</html>
