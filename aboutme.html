<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me | Naufy's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Margarine&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">

<body class="about-page">

      <img class="about-page__paperclip" src="Assets/aboutme/paperclip.png" alt="" draggable="false">
      <img class="about-page__focus-area" src="Assets/aboutme/focusarea.png" alt="Focus area" draggable="false">
      <img class="about-page__what-good" src="Assets/aboutme/whatimgoodat.png" alt="What I'm good at" draggable="false">
