<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <title>Home | Naufy Portfolio</title>
  <link rel="icon" type="image/png" href="Assets/fishsticker.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Margarine&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="site-loader" aria-live="polite">
    <section class="site-loader__status" aria-label="Loading portfolio table">
      <h1 class="site-loader__title">
        Preparing Table<span class="site-loader__dots" aria-hidden="true"></span>
      </h1>
      <img class="site-loader__sticker" src="Assets/fishsticker.webp" alt="" draggable="false">
      <p class="site-loader__wait">
        <span class="site-loader__wait-text">please wait</span>
        <span class="site-loader__face" aria-hidden="true">( &#8807;&#8704;&#8806;)&#12494;</span>
      </p>
    </section>
  </div>
  <main class="viewport" aria-label="Portfolio canvas">
    <div class="canvas-world">
      <a class="about-card" href="aboutme.html" aria-label="About me">
        <img class="about-card__image" src="Assets/Aboutme.webp" alt="About me" draggable="false">
        <span class="about-card__button">About me</span>
        <img class="about-card__drawing" src="Assets/dRAWING.webp" alt="Portrait drawing of Naufy" draggable="false">
        <span class="about-card__tagline">Get to<br>know me</span>
        <img class="about-card__decoration about-card__line-wave" src="Assets/linewave.webp" alt="" draggable="false">
        <img class="about-card__decoration about-card__line-thin" src="Assets/linethin.webp" alt="" draggable="false">
        <img class="about-card__decoration about-card__line-one" src="Assets/line1.webp" alt="" draggable="false">
        <img class="about-card__decoration about-card__star about-card__star--one" src="Assets/star.webp" alt="" draggable="false">
        <img class="about-card__decoration about-card__star about-card__star--two" src="Assets/starsmany1.webp" alt="" draggable="false">
        <img class="about-card__decoration about-card__star about-card__star--three" src="Assets/starsmany2.webp" alt="" draggable="false">
        <img class="about-card__decoration about-card__know-more" src="Assets/knowmore.webp" alt="Know more" draggable="false">
      </a>
      <section class="tool-cluster" aria-label="Desk tools">
        <img class="tool-cluster__item tool-cluster__stapler" src="Assets/blue-stapler 2.webp" alt="Blue stapler" draggable="false">
        <div class="tool-cluster__shadow tool-cluster__shadow--stapler" aria-hidden="true"></div>
        <img class="tool-cluster__item tool-cluster__pencil" src="Assets/pencil.webp" alt="Yellow pencil" draggable="false">
        <div class="tool-cluster__shadow tool-cluster__shadow--pencil" aria-hidden="true"></div>
        <img class="tool-cluster__item tool-cluster__eraser" src="Assets/eraser.webp" alt="Pink eraser" draggable="false">
        <div class="tool-cluster__shadow tool-cluster__shadow--eraser" aria-hidden="true"></div>
      </section>
      <section class="sticky-note" aria-label="Skills">
        <img class="sticky-note__image" src="Assets/stickynote.webp" alt="" draggable="false">
        <img class="sticky-note__label" src="Assets/Skills.webp" alt="Skills" draggable="false">
        <img class="sticky-note__pin" src="Assets/Weight.webp" alt="" draggable="false">
      </section>
      <section class="plant-pot" aria-label="Desk plant">
        <img class="plant-pot__image" src="Assets/plant.webp" alt="Plant" draggable="false">
        <div class="plant-pot__shadow" aria-hidden="true"></div>
      </section>
      <section class="ruler-edge" aria-label="Wooden ruler">
        <img class="ruler-edge__image" src="Assets/ruler.webp" alt="Wooden ruler" draggable="false">
      </section>
      <a class="document-card" href="projects.html" aria-label="Open projects">
        <img class="document-card__image" src="Assets/Document.webp" alt="Document" draggable="false">
        <div class="document-card__content">
          <h2 class="document-card__title">Projects</h2>
          <img class="document-card__top-secret" src="Assets/TopSecret.webp" alt="" draggable="false">
          <p class="document-card__description">A Collection of my other projects, works, portfolio</p>
        </div>
        <img class="document-card__open-tape" src="Assets/opentape.webp" alt="Open" draggable="false">
      </a>
      <section class="letter-card" aria-label="Contact letter">
        <img class="letter-card__image" src="Assets/letter.webp" alt="Contact letter" draggable="false">
        <div class="letter-card__content">
          <h2 class="letter-card__title">Contact</h2>
          <img class="letter-card__airplane" src="Assets/PaperAirplane.webp" alt="" draggable="false">
          <div class="letter-card__buttons" aria-label="Contact links">
            <a class="letter-card__button" href="https://github.com/Mafuruko" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
              <i class="letter-card__icon bi bi-github" aria-hidden="true"></i>
              <span>Github</span>
            </a>
            <a class="letter-card__button" href="https://www.linkedin.com/in/naufalnaufal/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
              <i class="letter-card__icon bi bi-linkedin" aria-hidden="true"></i>
              <span>Linkedin</span>
            </a>
            <a class="letter-card__button" href="https://mail.google.com/mail/?view=cm&fs=1&to=mnaufaldzakwan04@gmail.com" target="_blank" rel="noopener noreferrer" aria-label="Email">
              <i class="letter-card__icon bi bi-envelope-fill" aria-hidden="true"></i>
              <span>Email</span>
            </a>
            <a class="letter-card__button" href="https://wa.me/6285349425454" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
              <i class="letter-card__icon bi bi-whatsapp" aria-hidden="true"></i>
              <span>Whatsapp</span>
            </a>
          </div>
          <p class="letter-card__note">Tap a card, say hi, let's build something neat.</p>
        </div>
      </section>
      <section class="experience-board" aria-label="Organizational Experience">
        <img class="experience-board__title" src="Assets/experiencetittle.webp" alt="Organizational Experience" draggable="false">
        <img class="experience-board__card experience-board__card--creator" src="Assets/contentcreator.webp" alt="Content Creator experience" draggable="false">
        <img class="experience-board__card experience-board__card--pdd" src="Assets/pdd.webp" alt="Publication Documentation and Decoration experience" draggable="false">
        <img class="experience-board__card experience-board__card--branding" src="Assets/kabirobranding.webp" alt="Head of Branding Bureau experience" draggable="false">
      </section>
      <section class="sticker-layer" aria-label="Decorative stickers">
        <img class="sticker sticker--you-did-it" src="Assets/yourdiditsticker.webp" alt="" draggable="false">
        <img class="sticker sticker--emoji" src="Assets/emojisticker.webp" alt="" draggable="false">
        <img class="sticker sticker--fish" src="Assets/fishsticker.webp" alt="" draggable="false">
        <img class="sticker sticker--drag-me" src="Assets/dragmesticker.webp" alt="" draggable="false">
      </section>
      <section class="scissors-corner" aria-label="Scissors">
        <img class="scissors-corner__image" src="Assets/scissors.webp" alt="Scissors" draggable="false">
        <div class="scissors-corner__shadow" aria-hidden="true"></div>
      </section>
      <section class="hero-card" aria-label="Welcome to Naufy's Portfolio Table">
        <img class="hero-card__image" src="Assets/header.webp" alt="Welcome to Naufy's Portfolio Table. Come and Explore my projects!" draggable="false">
      </section>
      <section class="intro-note" aria-label="Move your cursor to explore">
        <img class="intro-note__paper" src="Assets/moveyourcursor.webp" alt="Move your Cursor to explore!" draggable="false">
        <img class="intro-note__arrow intro-note__arrow--left" src="Assets/Arrow-1.webp" alt="" draggable="false">
        <img class="intro-note__arrow intro-note__arrow--top" src="Assets/Arrow-2.webp" alt="" draggable="false">
        <img class="intro-note__arrow intro-note__arrow--bottom" src="Assets/Arrow-3.webp" alt="" draggable="false">
      </section>
    </div>
  </main>
  <script src="js/index-loader.js"></script>
  <script src="js/canvas.js"></script>
</body>
</html>
